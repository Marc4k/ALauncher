buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
    minSdkVersion = 21
    versionMajor = 2
    versionMinor = 5
    versionPatch = 3
}

private Integer generateVersionCode() {
    return ext.versionMajor * 10000 + ext.versionMinor * 1000 + ext.versionPatch * 100 + 1
}

private String generateVersionName() {
    String versionName = "${ext.versionMajor}.${ext.versionMinor}.${ext.versionPatch}"
    return versionName
}

final String FRAMEWORK_PREBUILTS_DIR = "prebuilts"

apply plugin: 'com.android.application'

def props = new Properties()
File keystoreProperties = rootProject.file("keystore.properties")
if (keystoreProperties.exists()) {
    props.load(new FileInputStream(keystoreProperties))
} else {
    props['keystorefile'] = 'none';
}

android {
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.dworks.apps.alauncher"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName rootProject.generateVersionName()
        versionCode rootProject.generateVersionCode()

        vectorDrawables.useSupportLibrary = true
    }
    signingConfigs {
        release
    }
    buildTypes {
        debug {
            minifyEnabled false
            //applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            if (keystoreProperties.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }


    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src', 'src_plugins', 'generated_src', 'shade/src', 'shade/src_flags',
                            'src_shortcuts_overrides', 'shade/src_backport',
                            'shade/src_ui_overrides']
            aidl.srcDirs = ['shade/aidl']
            assets.srcDirs = ['shade/assets']
            manifest.srcFile 'LeewynManifest.xml'
        }

        debug {
            res.srcDirs = ['shade/res', 'shade/res_translations',
                           'shade/res_translations_manual', 'shade/res_ui_overrides']
        }

        release {
            res.srcDirs = ['shade/res', 'shade/res_translations',
                           'shade/res_translations_manual', 'shade/res_ui_overrides']
        }

    }
    lint {
        abortOnError false
    }
    buildFeatures {
        aidl true
    }
    namespace 'com.android.launcher3'//'dev.dworks.apps.alauncher'
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs.add("-Xbootclasspath/p:${FRAMEWORK_PREBUILTS_DIR}/libs/framework.jar")
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.annotation:annotation:1.9.1"

    implementation project(':IconLoader')
    implementation fileTree(dir: "${FRAMEWORK_PREBUILTS_DIR}/libs", include: 'launcher_protos.jar')
    implementation fileTree(dir: "${FRAMEWORK_PREBUILTS_DIR}/libs", include: 'plugin_core.jar')

}

if (keystoreProperties.exists()) {
    android.signingConfigs.release.storeFile file(props.keyStore)
    android.signingConfigs.release.storePassword props.keyStorePassword
    android.signingConfigs.release.keyAlias props.keyAlias
    android.signingConfigs.release.keyPassword props.keyAliasPassword
}
